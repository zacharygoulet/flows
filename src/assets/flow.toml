# Optional metadata for the whole flow. Details and checklist items appear in status.
summary = "Draft, review, and complete work."
details = "A small example showing flow-wide and step-specific guidance."
checklist = [
    "Use step guidance to drive the work.",
    "Move only along listed transitions; use jump for exceptional rework.",
]

# Initial step for each new instance.
initial_step = "Draft"

# Global guidance is included in status by default. Set false to hide it.
use_global = true

# Each step can have a summary, details, checklist, and allowed next steps.
[[steps]]
name = "Draft"
summary = "Prepare the work."
details = "Clarify the goal and decide what completion means."
checklist = ["Confirm the requested outcome.", "Identify relevant constraints."]
next = ["Review"]

[[steps]]
name = "Review"
summary = "Review the work."
details = "Check the result against the goal and validation evidence."
checklist = ["Inspect the changes.", "Run appropriate checks."]
next = ["Done", "Draft"] # Returning to Draft demonstrates a rework path.

[[steps]]
name = "Done"
summary = "Complete the work."
details = "Summarize the outcome and any remaining risks."
checklist = ["Report completion."]
next = [] # An empty list means there are no normal next-step transitions.
